<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your Tables | Velvet Grimoire</title><link rel="stylesheet" href="/assets/members.css"><script src="/engine/sync.js" defer></script><script src="/assets/members.js" defer></script></head><body>
<header class="app-header"><a class="wordmark" href="/members.html">VELVET GRIMOIRE</a><nav aria-label="Member navigation"><a href="/member-admin.html" id="adminLink" hidden>Member administration</a><button id="accountButton">Account</button><button id="logoutButton">Sign out</button></nav></header>
<main class="page"><div class="page-heading"><div><p class="eyebrow" id="memberGreeting">The private table</p><h1>Your tables</h1></div><button id="refreshTables">Refresh</button></div><p id="hubMessage" class="message" role="status" aria-live="polite"></p><div id="tableList" class="table-list" aria-live="polite"><p class="muted">Loading your tables...</p></div><section class="section" id="createSection" hidden><h2>New table</h2><form id="createTableForm" class="inline-form"><div class="field"><label for="newTableName">Table name</label><input id="newTableName" maxlength="80" required placeholder="Campaign name"></div><button type="submit" class="primary">Create table</button></form></section></main>
<dialog id="accountDialog" aria-labelledby="accountTitle"><h2 id="accountTitle">Your account</h2><p id="accountIdentity" class="muted"></p><form id="changePasswordForm"><label for="oldPassword">Current password</label><input id="oldPassword" type="password" autocomplete="current-password" required><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><p id="accountMessage" class="message" role="status"></p><div class="actions"><button type="button" id="closeAccount">Close</button><button class="primary" type="submit">Change password</button></div></form></dialog>
</body></html>
