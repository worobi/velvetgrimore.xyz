<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign In | Velvet Grimoire</title>
<link rel="stylesheet" href="/assets/members.css"><script src="/assets/login.js" defer></script>
</head><body class="login-page"><main class="login-main">
<a class="wordmark" href="/">VELVET GRIMOIRE</a><p class="eyebrow">The private table</p>
<section class="login-form" aria-labelledby="loginTitle"><h1 id="loginTitle">Welcome back.</h1><p class="muted" id="loginIntro">Sign in to return to your table.</p>
<form id="signInForm"><label for="loginEmail">Email or username</label><input id="loginEmail" name="username" autocomplete="username" required autofocus><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="256"><button class="primary wide" type="submit">Sign in <span aria-hidden="true">&rarr;</span></button></form>
<form id="inviteForm" hidden><label for="inviteEmail">Invited email</label><input id="inviteEmail" name="email" type="email" autocomplete="email" readonly required><label for="inviteName">Your display name</label><input id="inviteName" name="displayName" autocomplete="nickname" minlength="2" maxlength="80" required><label for="invitePassword">Create a password</label><input id="invitePassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required aria-describedby="passwordHint"><small id="passwordHint" class="muted">At least 12 characters.</small><label for="inviteConfirm">Confirm password</label><input id="inviteConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label class="check"><input id="adultConfirmed" type="checkbox" required><span>I am 18 or older.</span></label><button class="primary wide" type="submit">Accept invitation <span aria-hidden="true">&rarr;</span></button></form>
<form id="passwordForm" hidden><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button class="primary wide" type="submit">Save password</button></form>
<p id="loginMessage" class="message" role="status" aria-live="polite"></p><p class="login-foot" id="accessNotice">Members only. Access is by email invitation.</p><a class="subtle" href="mailto:Daddy@velvetgrimore.xyz">Contact the Warden</a></section>
<footer>Velvet Grimoire &middot; Adults 18+</footer></main></body></html>
