<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet Grimoire — Player View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07060a;
  --surface: #100d14;
  --surface2: #16121e;
  --border: rgba(150,120,200,0.15);
  --border-hot: rgba(150,120,200,0.4);
  --purple: #9060c0;
  --purple-dim: #604080;
  --gold: #c8a060;
  --text: #ddd0f0;
  --text-dim: #8878a0;
  --text-muted: #3a3050;
  --fight: #cc3322;
  --flight: #2266bb;
  --fawn: #7a3a8a;
  --freeze: #aa8800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  font-size: 17px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* Atmospheric */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at 30% 0%, rgba(90,40,140,0.2) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 100%, rgba(40,20,80,0.25) 0%, transparent 60%);
  pointer-events: none;
}

.container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; width: 100%; }

/* Header */
.header { text-align: center; margin-bottom: 40px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
.header-eyebrow { font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
.header-title { font-family: 'Cinzel', serif; font-size: clamp(20px, 5vw, 32px); color: var(--purple); font-weight: 400; letter-spacing: 2px; }
.header-role { font-size: 13px; color: var(--text-dim); margin-top: 6px; font-style: italic; }

/* NPC badge */
.npc-badge {
  display: inline-flex; align-items: center; gap: 12px;
  background: rgba(90,40,140,0.15); border: 1px solid rgba(150,120,200,0.2);
  border-radius: 6px; padding: 14px 20px; margin-bottom: 28px; width: 100%;
}
.npc-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, var(--purple-dim), #302050);
  border: 1px solid var(--border-hot);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.npc-info-name { font-family: 'Cinzel', serif; font-size: 16px; color: var(--text); }
.npc-info-role { font-size: 13px; color: var(--text-dim); margin-top: 2px; font-style: italic; }

/* Scene blocks */
.scene-title {
  font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold);
  margin-bottom: 20px; letter-spacing: 1px;
  padding-bottom: 12px; border-bottom: 1px solid rgba(200,160,96,0.15);
}

.dm-narrative {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  border-left: 3px solid rgba(200,160,96,0.3);
  border-radius: 0 4px 4px 0; padding: 20px 20px;
  line-height: 1.9; color: var(--text-dim); font-size: 16px;
  margin-bottom: 24px; white-space: pre-wrap;
  font-style: italic;
}
.dm-narrative-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }

.npc-cue {
  background: rgba(90,40,140,0.12); border: 1px solid rgba(150,120,200,0.2);
  border-left: 3px solid var(--purple);
  border-radius: 0 6px 6px 0; padding: 20px;
  line-height: 1.9; font-size: 16px; color: #b0a0d8;
  margin-bottom: 28px; white-space: pre-wrap;
  animation: fadeInUp 0.6s ease;
}
.npc-cue-label {
  font-size: 10px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--purple-dim); margin-bottom: 8px;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Branch result */
.branch-result {
  border-radius: 6px; padding: 20px; margin-bottom: 20px;
  line-height: 1.9; font-size: 16px; white-space: pre-wrap;
  animation: fadeInUp 0.5s ease;
}
.branch-result.fight { background: rgba(204,51,34,0.1); border: 1px solid rgba(204,51,34,0.25); border-left: 3px solid var(--fight); }
.branch-result.flight { background: rgba(34,102,187,0.1); border: 1px solid rgba(34,102,187,0.25); border-left: 3px solid var(--flight); }
.branch-result.fawn   { background: rgba(122,58,138,0.1); border: 1px solid rgba(122,58,138,0.25); border-left: 3px solid var(--fawn); }
.branch-result.freeze { background: rgba(170,136,0,0.1); border: 1px solid rgba(170,136,0,0.25); border-left: 3px solid var(--freeze); }

/* Attributes display */
.attrs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.attr-chip {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  border: 1px solid var(--border); color: var(--text-dim);
  background: var(--surface2);
}
.attr-chip strong { color: var(--gold); font-family: 'Cinzel', serif; }

/* Dice display */
.dice-area {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 20px; margin-bottom: 24px;
  text-align: center;
}
.dice-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
.dice-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.die-btn {
  padding: 10px 16px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface2);
  color: var(--text-dim); font-family: 'Cinzel', serif; font-size: 12px;
  transition: all 0.15s; letter-spacing: 1px;
}
.die-btn:hover { border-color: var(--border-hot); color: var(--text); transform: translateY(-2px); }
.die-btn.rolling { animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px) rotate(-5deg)} 75%{transform:translateX(4px) rotate(5deg)} }
.roll-output { font-family: 'Cinzel', serif; font-size: 42px; color: var(--purple); margin: 12px 0 4px; }
.roll-detail { font-size: 13px; color: var(--text-muted); }

/* Choice response area */
.response-area { margin-top: 28px; }
.response-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
textarea.npc-response {
  width: 100%; background: rgba(90,40,140,0.1);
  border: 1px solid rgba(150,120,200,0.2); border-radius: 4px;
  padding: 14px; color: var(--text); font-family: 'Crimson Pro', serif;
  font-size: 16px; line-height: 1.7; outline: none; resize: vertical; min-height: 120px;
  transition: border 0.15s;
}
textarea.npc-response:focus { border-color: var(--border-hot); }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border-radius: 4px; cursor: pointer;
  font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 2px;
  text-transform: uppercase; border: 1px solid; transition: all 0.15s;
}
.btn-purple { background: rgba(90,40,140,0.25); border-color: var(--purple-dim); color: #c0a0e0; }
.btn-purple:hover { background: rgba(90,40,140,0.4); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
.btn-ghost:hover { border-color: var(--border-hot); color: var(--text); }

/* Status */
.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  background: rgba(7,6,10,0.95); border-top: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(10px);
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 6px; }
.status-dot.active { background: #8844ff; box-shadow: 0 0 8px #8844ff; }

/* No session */
.no-session {
  text-align: center; padding: 60px 20px;
  color: var(--text-dim); font-style: italic;
}
.no-session h2 { font-family: 'Cinzel', serif; color: var(--purple); font-size: 22px; margin-bottom: 12px; font-weight: 400; }

/* Tags */
.tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; border: 1px solid rgba(150,120,200,0.2); color: var(--purple-dim); background: rgba(90,40,140,0.08); margin: 2px; }

.ward-entry, .signal-banner {
  background: rgba(16,13,20,0.9);
  border: 1px solid rgba(150,120,200,0.22);
  border-radius: 8px;
  padding: 22px 20px;
  margin-bottom: 24px;
}
.ward-entry-title, .signal-banner-title {
  font-family: 'Cinzel', serif;
  font-size: 18px;
  color: var(--gold);
  margin-bottom: 8px;
}
.ward-stack-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.ward-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 18px;
  border: 1px solid rgba(200,160,96,0.2);
  background: rgba(200,160,96,0.08);
  color: var(--text-dim);
  font-size: 12px;
}
.ward-entry-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.session-summary {
  background: rgba(255,255,255,0.025);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 22px;
}
.summary-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}
.summary-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
}
.summary-value {
  color: var(--text-dim);
  font-size: 14px;
  line-height: 1.4;
}
.summary-value strong {
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 1px;
}
.intimacy-card {
  background: linear-gradient(135deg, rgba(90,40,140,0.14), rgba(0,0,0,0.26));
  border: 1px solid rgba(150,120,200,0.28);
  border-radius: 8px;
  padding: 18px;
  margin-bottom: 24px;
}
.intimacy-title {
  font-family: 'Cinzel', serif;
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.compat-line { color: var(--text-dim); font-size: 13px; line-height: 1.6; margin-bottom: 12px; }
.intimacy-toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.intimacy-toolbar label, .intimacy-card label {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.intimacy-card select, .intimacy-card input, .intimacy-card textarea {
  width: 100%;
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 9px 10px;
  color: var(--text);
  font-family: 'Crimson Pro', serif;
  font-size: 15px;
}
.heat-track { height: 10px; border-radius: 999px; background: rgba(255,255,255,0.06); overflow: hidden; border: 1px solid var(--border); }
.heat-fill { height: 100%; background: linear-gradient(90deg, #604080, #c8a060, #dd4422); }
.prompt-row, .want-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prompt-chip, .want-chip {
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.035);
  color: var(--text-dim);
  border-radius: 18px;
  padding: 6px 10px;
  font-size: 12px;
  cursor: pointer;
}
.want-chip input { width: auto; margin-right: 5px; }
.chat-log { max-height: 240px; overflow-y: auto; display: grid; gap: 8px; padding: 10px; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
.chat-msg { border-left: 3px solid var(--purple); padding: 8px 10px; background: rgba(255,255,255,0.025); border-radius: 4px; }
.chat-msg.dm { border-left-color: var(--gold); }
.chat-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--text-muted); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.intimacy-chat-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: start; }
.remote-join {
  background: rgba(90,40,140,0.12);
  border: 1px solid rgba(150,120,200,0.24);
  border-radius: 8px;
  padding: 18px;
  margin-top: 18px;
}
.remote-join-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  margin-top: 10px;
}
.remote-join input {
  width: 100%;
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--text);
  text-transform: uppercase;
}
.locked {
  opacity: 0.5;
  pointer-events: none;
}

/* History */
.history-mini { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
.history-item { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--text-dim); }
.history-item strong { color: var(--text); }

@media (max-width: 640px) {
  .summary-grid { grid-template-columns: 1fr; }
  .intimacy-toolbar, .intimacy-chat-row { grid-template-columns: 1fr; }
  .remote-join-row { grid-template-columns: 1fr; }
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-eyebrow">✦ Velvet Grimoire ✦</div>
    <h1 class="header-title">NPC Player View</h1>
    <p class="header-role">You are the scene's counterpart. React. Resist. Reveal.</p>
  </div>

  <div id="mainContent"></div>
</div>

<div class="status-bar">
  <div>
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText" style="font-size:13px;color:var(--text-dim);">Waiting for session...</span>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-ghost" style="padding:6px 12px;font-size:10px;" onclick="refreshView()">🔄 Refresh</button>
    <button class="btn btn-ghost" style="padding:6px 12px;font-size:10px;" onclick="toggleHistory()">📖 Log</button>
  </div>
</div>

<script src="../engine/engine.js"></script>
<script src="../engine/intimacy.js"></script>
<script src="../engine/sync.js"></script>
<script>

let showHistory = false;
let playerRoll = null;
let lastProcessedSignalAt = sessionStorage.getItem('vg_player_last_signal_at') || '';
let activeSafetySignal = null;

function init() {
  initRemoteSync();
  const latest = VGEngine.getLatestSignal ? VGEngine.getLatestSignal() : null;
  activeSafetySignal = latest || null;
  if (!lastProcessedSignalAt && latest?.at) lastProcessedSignalAt = latest.at;
  const session = VGEngine.resumeSession();
  render(session);
  setInterval(refreshView, 2000);
  window.addEventListener('storage', onSharedStateChange);
}

function refreshView() {
  pollSafetyRuntime();
  const session = VGEngine.resumeSession();
  render(session);
}

function render(session) {
  const content = document.getElementById('mainContent');
  const dot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  if (!session?.id) {
    dot.className = 'status-dot';
    statusText.textContent = 'No active session — DM has not started a game.';
    content.innerHTML = `
      <div class="no-session">
        <h2>The Grimoire Awaits</h2>
        <p>No session is currently active.<br>Wait for the DM to launch a campaign.</p>
        <p style="margin-top:20px;font-size:14px;opacity:0.5;">This view refreshes automatically every 2 seconds.</p>
        <div class="remote-join">
          <div style="font-family:'Cinzel',serif;color:var(--gold);font-size:14px;letter-spacing:1px;margin-bottom:6px;">Join Remote Table</div>
          <p style="font-size:14px;line-height:1.6;">Enter the table code from the Warden. The backend URL defaults to this site.</p>
          <div class="remote-join-row">
            <input type="text" id="playerSyncName" placeholder="Your table name">
            <select id="playerSyncRole" style="background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:var(--text);">
              <option value="protagonist">Protagonist</option>
              <option value="boss">Boss</option>
              <option value="spectator">Spectator</option>
            </select>
          </div>
          <div class="remote-join-row">
            <input type="text" id="playerSyncCode" placeholder="ABC123">
            <button class="btn btn-purple" onclick="joinRemoteTableFromPlayer()">Join</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="btn btn-ghost" onclick="playerRefreshLobby()">Refresh Lobby</button>
            <button class="btn btn-ghost" onclick="playerToggleReady()">Toggle Ready</button>
          </div>
          <div id="playerSyncStatus" style="font-size:13px;color:var(--text-muted);margin-top:10px;"></div>
          <div id="playerSyncLobby" style="display:grid;gap:8px;margin-top:12px;"></div>
        </div>
      </div>`;
    return;
  }

  const campaign = VGEngine.getState().campaign;
  const scene = VGEngine.getCurrentScene();
  const holdActive = activeSafetySignal?.tier === 'hold';
  dot.className = 'status-dot active';
  statusText.textContent = holdActive
    ? 'Hold active — page paused'
    : `Active — ${campaign?.name || 'Campaign'}`;

  if (!scene) {
    content.innerHTML = `
      <div class="npc-badge">
        <div class="npc-avatar">✦</div>
        <div><div class="npc-info-name">${campaign?.npc?.name || 'NPC'}</div><div class="npc-info-role">${campaign?.npc?.role || ''}</div></div>
      </div>
      <div class="no-session">
        <h2 style="color:var(--gold);">✦ Scene Complete ✦</h2>
        <p>The campaign has reached its conclusion, or the DM has not set a next scene.</p>
      </div>
      ${renderHistorySection()}`;
    return;
  }

  const history = VGEngine.getSessionHistory();
  const lastEntry = history[history.length - 1];
  const branchResult = lastEntry?.sceneId !== scene.id && lastEntry ? lastEntry : null;
  const signalBanner = renderSignalBanner();
  const sessionSummary = renderSessionSummary(campaign, scene, history, holdActive);
  const intimacyPanel = renderIntimacyPanel('player', session, scene, holdActive);

  // Protagonist sign-off — blocks play until the player has reviewed the
  // DM's hard-gated ward list. Happens once per campaign, before any scene.
  if (campaign && campaign.protagonistAckedWards == null) {
    content.innerHTML = renderProtagonistSignoff(campaign, signalBanner);
    return;
  }

  // Per-scene gate: if the scene carries a hard-gated ward the protagonist
  // declined, hold the scene closed and offer to signal the Ember.
  const gatedRegistry = (VGEngine.WARD_HARD_GATED || []);
  const declined = (scene.elementWards || []).filter(w =>
    gatedRegistry.includes(w) && !(campaign.protagonistAckedWards || []).includes(w)
  );
  if (declined.length && !hasEnteredScene(session, scene)) {
    content.innerHTML = `
      ${signalBanner}
      ${sessionSummary}
      <div class="ward-entry">
        <div class="ward-entry-title">🔒 Ward declined</div>
        <div style="color:var(--text-dim);line-height:1.8;">
          This scene carries a ward you declined at sign-off: <strong>${declined.map(escapeHtml).join(', ')}</strong>.
          The scene will not open here. Signal the Ember so the DM can redraw or pause.
        </div>
        <div class="ward-entry-actions">
          <button class="btn btn-ghost" onclick="signalEmber()">🕯️ Signal the Ember</button>
          <button class="btn btn-ghost" onclick="openResignModal()">Revisit sign-off</button>
        </div>
      </div>
      ${renderHistorySection()}
    `;
    return;
  }

  if (!hasEnteredScene(session, scene)) {
    content.innerHTML = `
      <div class="npc-badge">
        <div class="npc-avatar">🎭</div>
        <div>
          <div class="npc-info-name">${campaign?.npc?.name || 'NPC Character'}</div>
          <div class="npc-info-role">${campaign?.npc?.role || ''} — ${campaign?.npc?.personality?.slice(0,60) || ''}</div>
        </div>
      </div>

      ${signalBanner}
      ${sessionSummary}

      <div class="ward-entry">
        <div class="ward-entry-title">✦ Warded Entry ✦</div>
        <div style="color:var(--text-dim);line-height:1.8;">Review the ward stack before the scene opens. Enter in your own time, or signal the Ember first.</div>
        <div class="ward-stack-row">${(scene.elementWards || []).map(w => `<span class="ward-pill">${escapeHtml(w)}</span>`).join('') || '<span class="ward-pill">No element wards</span>'}</div>
        <div class="ward-stack-row">
          <span class="ward-pill">Intensity: ${escapeHtml(scene.intensityWard || 'suggested')}</span>
          <span class="ward-pill">Frame: ${escapeHtml(scene.frameWard || 'consensual-if')}</span>
        </div>
        <div class="ward-entry-actions">
          <button class="btn btn-purple" onclick="enterScene('${session.id}','${scene.id}')" ${holdActive ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>✦ Enter the Scene</button>
          <button class="btn btn-ghost" onclick="signalEmber()">🕯️ Signal the Ember</button>
        </div>
      </div>

      ${renderHistorySection()}
    `;
    return;
  }

  content.innerHTML = `
    <div class="npc-badge">
      <div class="npc-avatar">🎭</div>
      <div>
        <div class="npc-info-name">${campaign?.npc?.name || 'NPC Character'}</div>
        <div class="npc-info-role">${campaign?.npc?.role || ''} — ${campaign?.npc?.personality?.slice(0,60) || ''}</div>
      </div>

function initRemoteSync() {
  if (!window.VGSync) return;
  VGSync.start({
    onApply: () => {
      VGEngine.resumeSession();
      refreshView();
    },
    onStatus: updatePlayerSyncStatus,
    onLobby: renderPlayerLobby,
    onError: err => updatePlayerSyncStatus({ ...VGSync.status(), error: err.message }),
  });
}

function updatePlayerSyncStatus(status = (window.VGSync ? VGSync.status() : null)) {
  const el = document.getElementById('playerSyncStatus');
  if (!el || !status) return;
  el.textContent = status.enabled && status.code
    ? `Connected to table ${status.code} · ${status.role || 'protagonist'} · ${status.ready ? 'ready' : 'not ready'} · revision ${status.lastRev || 0}${status.error ? ` · ${status.error}` : ''}`
    : (status.error ? `Sync error: ${status.error}` : '');
  renderPlayerLobby(status.table);
}

function renderPlayerLobby(table = (window.VGSync ? VGSync.status().table : null)) {
  const el = document.getElementById('playerSyncLobby');
  if (!el) return;
  const players = table?.players || [];
  if (!players.length) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = players.map(player => `
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;background:rgba(255,255,255,0.025);border:1px solid var(--border);border-radius:6px;padding:8px 10px;">
      <div><strong style="color:var(--text);">${escapeHtml(player.name || 'Seated Player')}</strong><span style="color:var(--text-muted);font-size:12px;"> · ${escapeHtml(player.role || 'protagonist')}</span></div>
      <div style="font-size:12px;color:${player.ready ? 'var(--gold)' : 'var(--text-muted)'};">${player.ready ? 'ready' : 'not ready'}</div>
    </div>
  `).join('');
}

async function joinRemoteTableFromPlayer() {
  if (!window.VGSync) return;
  const code = document.getElementById('playerSyncCode')?.value || '';
  const name = document.getElementById('playerSyncName')?.value || 'Protagonist';
  const role = document.getElementById('playerSyncRole')?.value || 'protagonist';
  try {
    const table = await VGSync.joinTable(code, { name, role, ready: true });
    localStorage.setItem('vg_role', 'player');
    renderPlayerLobby(table.table);
    VGEngine.resumeSession();
    refreshView();
  } catch (err) {
    updatePlayerSyncStatus({ ...VGSync.status(), error: err.message });
    showToast(`Join failed: ${err.message}`);
  }
}

async function playerRefreshLobby() {
  if (!window.VGSync) return;
  try {
    const table = await VGSync.fetchLobby();
    renderPlayerLobby(table);
    updatePlayerSyncStatus(VGSync.status());
  } catch (err) {
    updatePlayerSyncStatus({ ...VGSync.status(), error: err.message });
    showToast(`Lobby refresh failed: ${err.message}`);
  }
}

async function playerToggleReady() {
  if (!window.VGSync) return;
  try {
    const status = VGSync.status();
    const table = await VGSync.setReady(!status.ready);
    renderPlayerLobby(table);
    updatePlayerSyncStatus(VGSync.status());
  } catch (err) {
    updatePlayerSyncStatus({ ...VGSync.status(), error: err.message });
    showToast(`Ready update failed: ${err.message}`);
  }
}

function playerRollDie(sides) {
  if (activeSafetySignal?.tier === 'hold') {
    showToast('Hold is active. Wait for the page to resume before rolling.');
    return;
  }
  const result = Math.floor(Math.random() * sides) + 1;
  playerRoll = { result, sides };
  const output = document.getElementById('playerRollOutput');
  const detail = document.getElementById('playerRollDetail');
  if (output) {
    output.textContent = result;
    detail.textContent = `d${sides} — ${getRollFlair(result, sides)}`;
    const btn = [...document.querySelectorAll('.die-btn')].find(b => b.textContent === 'd'+sides);
    if (btn) { btn.classList.add('rolling'); setTimeout(() => btn.classList.remove('rolling'), 400); }
  }
}

function getRollFlair(result, sides) {
  if (result === sides) return '✦ Critical Success!';
  if (result === 1) return '💀 Critical Fail';
  if (result >= sides * 0.8) return 'Strong result';
  if (result <= sides * 0.2) return 'Weak result';
  return 'Moderate result';
}

function loadNPCResponse(sceneId) {
  return localStorage.getItem('npc_response_' + sceneId) || '';
}

function saveNPCResponse(sceneId) {
  if (activeSafetySignal?.tier === 'hold') {
    showToast('Hold is active. Writing is paused for now.');
    return;
  }
  const text = document.getElementById('npcResponseText')?.value || '';
  localStorage.setItem('npc_response_' + sceneId, text);
  showToast('Response saved!');
}

function clearNPCResponse(sceneId) {
  if (activeSafetySignal?.tier === 'hold') {
    showToast('Hold is active. Writing is paused for now.');
    return;
  }
  localStorage.removeItem('npc_response_' + sceneId);
  const el = document.getElementById('npcResponseText');
  if (el) el.value = '';
}

function renderHistorySection() {
  if (!showHistory) return `<div class="history-mini"><p style="font-size:13px;color:var(--text-muted);font-style:italic;">Click "Log" in the toolbar to see session history.</p></div>`;
  const history = VGEngine.getSessionHistory();
  if (!history.length) return `<div class="history-mini"><p style="font-size:13px;color:var(--text-muted);font-style:italic;">No history yet.</p></div>`;
  const colors = { fight:'#ff8070', flight:'#80a8ff', fawn:'#c090e0', freeze:'#ffcc50' };
  return `<div class="history-mini">
    <div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;">Session History</div>
    ${history.map((h,i) => `
      <div class="history-item">
        <span><strong>${i+1}. ${h.sceneTitle}</strong></span>
        <span style="color:${colors[h.choiceMade]}">${h.choiceMade.toUpperCase()}${h.roll ? ` — d20:${h.roll.result}` : ''}</span>
      </div>`).join('')}

}

function renderSessionSummary(campaign, scene, history, holdActive) {
  const last = history[history.length - 1];
  const wardText = [
    ...(scene?.elementWards || []),
    scene?.intensityWard ? `intensity:${scene.intensityWard}` : '',

function getIntimacyContext() {
  const session = VGEngine.getState().session;
  const scene = VGEngine.getCurrentScene();
  if (!session?.id || !scene?.id) return null;
  return { session, scene };
}

function setIntimacyConsent(role, level) {
  const ctx = getIntimacyContext();
  if (!ctx || !window.VGIntimacy) return;
  VGIntimacy.setConsent(ctx.session.id, ctx.scene.id, role, level);
  if (level === 'veil') showToast('Veil selected. Turn the camera away or move to Hearth.');
  refreshView();
}

function setIntimacyHeat(value) {
  const ctx = getIntimacyContext();
  if (!ctx || !window.VGIntimacy) return;
  VGIntimacy.setHeat(ctx.session.id, ctx.scene.id, value);
  refreshView();
}

function insertIntimacyPrompt(role, text, heat) {
  const input = document.getElementById(`intimacyText-${role}`);
  if (!input) return;
  input.value = input.value ? `${input.value}\n${text}` : text;
  input.dataset.heat = String(heat || 0);
  input.focus();
}

function sendIntimacyMessage(role) {
  if (activeSafetySignal?.tier === 'hold') {
    showToast('Hold is active. Resume before sending.');
    return;
  }
  const ctx = getIntimacyContext();
  if (!ctx || !window.VGIntimacy) return;
  const input = document.getElementById(`intimacyText-${role}`);
  const mode = document.getElementById(`intimacyMode-${role}`)?.value || 'spoken';
  const heatDelta = Number(input?.dataset.heat || 0);
  const sent = VGIntimacy.sendMessage({
    sessionId: ctx.session.id,
    sceneId: ctx.scene.id,
    role,
    mode,
    text: input?.value || '',
    heatDelta,
  });
  if (sent && input) {
    input.value = '';
    input.dataset.heat = '0';
    refreshView();
  }
}

function saveIntimacyCard(role) {
  const ctx = getIntimacyContext();
  if (!ctx || !window.VGIntimacy) return;
  const want = [...document.querySelectorAll(`[data-want-${role}]`)]
    .filter(el => el.checked)
    .map(el => el.getAttribute(`data-want-${role}`));
  VGIntimacy.saveCard(ctx.session.id, ctx.scene.id, role, {
    want,
    pace: document.getElementById(`intimacyPace-${role}`)?.value || 'slow',
    ceiling: document.getElementById(`intimacyCeiling-${role}`)?.value || 'suggestive',
    notTonight: document.getElementById(`intimacyNotTonight-${role}`)?.value || '',
    note: document.getElementById(`intimacyNote-${role}`)?.value || '',
  });
  showToast('Intimate table card saved.');
  refreshView();
}

function toggleHistory() {
  showHistory = !showHistory;
  refreshView();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getSceneEntryKey(sessionId, sceneId) {
  return `vg_scene_entered_${sessionId}_${sceneId}`;
}

function hasEnteredScene(session, scene) {
  return !!localStorage.getItem(getSceneEntryKey(session.id, scene.id));
}

function enterScene(sessionId, sceneId) {
  if (activeSafetySignal?.tier === 'hold') {
    showToast('Hold is active. Resume the page before entering.');
    return;
  }
  localStorage.setItem(getSceneEntryKey(sessionId, sceneId), '1');
  refreshView();
}

function signalEmber() {
  window.open('/pause.html#ember', '_blank', 'noopener');
}

// ── Protagonist ward-ack sign-off ──────────────────────────────
// Shown once per campaign before the first Warded Entry. The DM has
// already acked the hard-gated wards at campaign creation; this is the
// player's chance to uncheck any they don't personally consent to.
function renderProtagonistSignoff(campaign, signalBanner) {
  const dmAcked = Array.isArray(campaign.ackedWards) ? campaign.ackedWards : [];
  if (!dmAcked.length) {
    // Nothing gated in this campaign — auto-sign off so play can begin.
    VGEngine.setProtagonistAcks(campaign.id, []);
    setTimeout(refreshView, 0);
    return `<div class="no-session"><p>Preparing ward stack…</p></div>`;
  }
  const rows = dmAcked.map(w => `
    <label style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;">
      <input type="checkbox" class="vg-protag-ack" value="${escapeHtml(w)}" checked>
      <span class="ward-pill">${escapeHtml(w)}</span>
    </label>
  `).join('');
  return `
    ${signalBanner}
    <div class="ward-entry">
      <div class="ward-entry-title">✦ Protagonist Sign-Off ✦</div>
      <div style="color:var(--text-dim);line-height:1.8;">
        Your DM has acknowledged the following hard-gated wards for this campaign.
        Leave checked what you consent to encounter in play. Uncheck anything you'd rather not — any scene carrying a declined ward will be held closed and surfaced to the DM as an Ember signal.
      </div>
      <div style="margin:16px 0 8px 0;">${rows}</div>
      <div class="ward-entry-actions">
        <button class="btn btn-purple" onclick="submitProtagonistSignoff('${campaign.id}')">✦ Sign off — begin play</button>
        <button class="btn btn-ghost" onclick="signalEmber()">🕯️ Pause — talk to DM first</button>
      </div>
    </div>
  `;
}

function submitProtagonistSignoff(campaignId) {
  const boxes = document.querySelectorAll('.vg-protag-ack');
  const acked = Array.from(boxes).filter(b => b.checked).map(b => b.value);
  VGEngine.setProtagonistAcks(campaignId, acked);
  showToast(acked.length
    ? `Signed off on ${acked.length} ward${acked.length===1?'':'s'}.`
    : 'Signed off with all wards declined — scenes with gated wards will be held.');
  refreshView();
}

function openResignModal() {
  const session = VGEngine.resumeSession();
  const campaign = VGEngine.getState().campaign;
  if (!campaign) return;
  if (!confirm('Revisit the ward sign-off? This will re-open the sign-off screen.')) return;
  // Null it out so the render() branch shows the sign-off card again.
  VGEngine.setProtagonistAcks(campaign.id, []);
  // setProtagonistAcks stores [] — but for re-opening we want null.
  // Use saveCampaign via an engine-aware escape hatch:
  const fresh = VGEngine.getCampaign ? VGEngine.getCampaign(campaign.id) : null;
  if (fresh) {
    fresh.protagonistAckedWards = null;
    VGEngine.saveCampaign(fresh);
  }
  refreshView();
}

function renderSignalBanner() {
  if (!activeSafetySignal || !['hold','dim','veil','stoke','rewrite','resume'].includes(activeSafetySignal.tier)) return '';
  const tone = {
    hold: { title: '🟠 Hold active', body: 'The page is paused. Sit with the scene, breathe, and wait for the resume signal.' },
    dim: { title: '🟡 Dim signaled', body: 'Ease the current beat. Softer is the instruction.' },
    veil: { title: '🌫️ Veil signaled', body: 'Turn the camera away. Keep the scene impressionistic from here.' },
    stoke: { title: '🔥 Stoke signaled', body: 'Affirmative signal received. Stay inside the scene’s authored bounds.' },
    rewrite: { title: '✍️ Rewrite received', body: 'The last beat was taken back. Refreshing the page will show the rewound scene state.' },
    resume: { title: '✅ Page resumed', body: 'The hold is cleared. Proceed gently.' },
  }[activeSafetySignal.tier];
  return `<div class="signal-banner">
    <div class="signal-banner-title">${tone.title}</div>
    <div style="color:var(--text-dim);line-height:1.8;">${tone.body}</div>
  </div>`;
}

function onSharedStateChange(e) {
  if (['vg_signals','vg_session','vg_intimacy_chat','vg_intimacy_state','vg_intimacy_cards'].includes(e.key)) refreshView();
}

function pollSafetyRuntime() {
  const latest = VGEngine.getLatestSignal ? VGEngine.getLatestSignal() : null;
  activeSafetySignal = latest || null;
  if (latest?.at && latest.at !== lastProcessedSignalAt) {
    handleSafetySignal(latest);
    lastProcessedSignalAt = latest.at;
    sessionStorage.setItem('vg_player_last_signal_at', latest.at);
  }
}

function handleSafetySignal(signal) {
  if (!signal) return;
  if (signal.tier === 'snuff') {
    window.location.href = '/pause.html#hearth';
    return;
  }
  if (signal.tier === 'rewrite') {
    const session = VGEngine.resumeSession();
    const scene = VGEngine.getCurrentScene();
    if (session?.id && scene?.id) {
      localStorage.removeItem(getSceneEntryKey(session.id, scene.id));
    }
    showToast('Rewrite received — the last beat was taken back.');
    return;
  }
  const labels = {
    hold: 'Hold received — pausing the page.',
    resume: 'Resume received — the page can move again.',
    dim: 'Dim received — ease the beat.',
    veil: 'Veil received — turn the camera away.',
    stoke: 'Stoke received — affirmative signal logged.',
  };
  if (labels[signal.tier]) showToast(labels[signal.tier]);
}

let toastTimeout;
function showToast(msg) {
  let toast = document.getElementById('playerToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'playerToast';
    toast.style.cssText = 'position:fixed;bottom:70px;right:20px;background:#201830;border:1px solid rgba(150,120,200,0.4);color:#c0a0e0;padding:12px 20px;border-radius:4px;font-size:14px;z-index:999;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
}

init();
</script>
