<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member Administration | Velvet Grimoire</title><link rel="stylesheet" href="/assets/members.css"><script src="/engine/sync.js" defer></script><script src="/assets/member-admin.js" defer></script></head><body>
<header class="app-header"><a class="wordmark" href="/members.html">VELVET GRIMOIRE</a><nav aria-label="Member navigation"><a href="/members.html">Your tables</a><button id="logoutButton">Sign out</button></nav></header>
<main class="page"><div class="page-heading"><div><p class="eyebrow">Members only</p><h1>Member administration</h1></div><button id="refreshAdmin">Refresh</button></div><p id="adminMessage" class="message" role="status" aria-live="polite"></p>
<div class="grid"><section><h2>Send an invitation</h2><form id="invitationForm" class="form-stack"><label for="inviteEmail">Email address</label><input id="inviteEmail" type="email" autocomplete="off" required maxlength="254"><label for="inviteName">Display name</label><input id="inviteName" maxlength="80" autocomplete="off"><label for="inviteRole">Role</label><select id="inviteRole"><option value="player">Player</option><option value="spectator">Spectator</option><option value="warden">Warden</option><option value="admin" id="adminRoleOption">Member administrator</option></select><label for="inviteTables">Assigned tables</label><select id="inviteTables" multiple></select><button type="submit" class="primary wide" id="sendInvitation">Send invitation</button></form></section>
<section id="mailSection" hidden><h2>Invitation email</h2><p class="muted">Daddy@velvetgrimore.xyz</p><p id="mailStatus" role="status">Checking connection...</p><form id="mailForm" class="form-stack"><label for="mailPassword">Spacemail mailbox password</label><input id="mailPassword" type="password" autocomplete="off" required maxlength="512"><button type="submit" class="wide" id="connectMail">Connect Spacemail</button></form></section></div>
<section class="section"><h2>Invitations</h2><div id="invitationList" class="list"></div></section><section class="section"><h2>Members</h2><div id="memberList" class="list"></div></section></main>
<dialog id="editMemberDialog" aria-labelledby="editMemberTitle"><h2 id="editMemberTitle">Member access</h2><p id="editMemberIdentity" class="muted"></p><form id="editMemberForm"><label for="editMemberName">Display name</label><input id="editMemberName" maxlength="80" required><label for="editMemberRole">Role</label><select id="editMemberRole"><option value="player">Player</option><option value="spectator">Spectator</option><option value="warden">Warden</option><option value="admin">Member administrator</option><option value="owner">Owner</option></select><label for="editMemberTables">Assigned tables</label><select id="editMemberTables" multiple></select><label class="check"><input id="editMemberActive" type="checkbox"><span>Account enabled</span></label><p id="editMemberMessage" class="message" role="status"></p><div class="actions"><button type="button" id="closeEditMember">Cancel</button><button type="submit" class="primary">Save access</button></div></form></dialog>
</body></html>
